<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><radialGradient id="wash" cx="70%" cy="12%" r="80%"><stop offset="0%" stop-color="#F3E8D2" stop-opacity="1"/><stop offset="100%" stop-color="#F3E8D2" stop-opacity="0"/></radialGradient></defs><g id="slide-03"><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF" rx="0"/><rect x="0" y="0" width="88" height="1080" fill="#F2F4F8" rx="0"/><line x1="88" y1="0" x2="88" y2="1080" stroke="#D2D7DF" stroke-width="1"/><text transform="translate(50 92) rotate(90)" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.2" fill="#A8761C">INSTALAR</text><line x1="44" y1="300" x2="44" y2="950" stroke="#BBC3CE" stroke-width="1"/><text transform="translate(49 970) rotate(90)" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#5C6573">II</text><text x="156" y="76" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.1" fill="#A8761C" text-anchor="start">INSTALAR</text><text x="1852" y="76" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#5C6573" text-anchor="end">03 / 13</text><line x1="156" y1="98" x2="1852" y2="98" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="144" font-family="Georgia, Constantia, Charter, serif" font-size="50" fill="#13171E">Un comando. Siete verbos.</text><g id="table"><text x="156" y="190" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5" fill="#5C6573" text-anchor="start">COMANDO</text><text x="394.92878048780494" y="190" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5" fill="#5C6573" text-anchor="start">QUÉ HACE</text><line x1="156" y1="202" x2="1009.3170731707318" y2="202" stroke="#BBC3CE" stroke-width="1"/><circle cx="161" cy="222" r="4.5" fill="#0F7A4A"/><text x="171" y="228" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16.5" font-weight="600" fill="#0F7A4A">init</text><text x="394.92878048780494" y="226.87" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Instala. Sirve igual en un repo vacío y en uno con cinco años de</tspan></text><text x="394.92878048780494" y="249.31" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>código.</tspan></text><line x1="156" y1="265.88" x2="1009.3170731707318" y2="265.88" stroke="#D2D7DF" stroke-width="1"/><circle cx="161" cy="279.88" r="4.5" fill="#2F6BA8"/><text x="171" y="285.88" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16.5" font-weight="600" fill="#2F6BA8">upgrade</text><text x="394.92878048780494" y="284.75" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Actualiza a la última versión y aplica las migraciones.</tspan></text><line x1="156" y1="304.88" x2="1009.3170731707318" y2="304.88" stroke="#D2D7DF" stroke-width="1"/><circle cx="161" cy="318.88" r="4.5" fill="#5C6573"/><text x="171" y="324.88" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16.5" font-weight="600" fill="#5C6573">status</text><text x="394.92878048780494" y="323.75" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Solo lectura. Salida 0 al día · 1 hay upgrade · 2 hay drift.</tspan></text><line x1="156" y1="343.88" x2="1009.3170731707318" y2="343.88" stroke="#D2D7DF" stroke-width="1"/><circle cx="161" cy="357.88" r="4.5" fill="#B23A26"/><text x="171" y="363.88" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16.5" font-weight="600" fill="#B23A26">adopt</text><text x="394.92878048780494" y="362.75" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Para una estructura hecha a mano. </tspan><tspan font-weight="650" fill="#13171E">No toca ningún archivo</tspan><tspan>: solo</tspan></text><text x="394.92878048780494" y="385.19" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>escribe el lockfile.</tspan></text><line x1="156" y1="401.76" x2="1009.3170731707318" y2="401.76" stroke="#D2D7DF" stroke-width="1"/><circle cx="161" cy="415.76" r="4.5" fill="#5C6573"/><text x="171" y="421.76" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16.5" font-weight="600" fill="#5C6573">monitor</text><text x="394.92878048780494" y="420.63" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Panel de consumo de tokens: límites, sesiones y proyectos.</tspan></text><line x1="156" y1="440.76" x2="1009.3170731707318" y2="440.76" stroke="#D2D7DF" stroke-width="1"/><circle cx="161" cy="454.76" r="4.5" fill="#2F6BA8"/><text x="171" y="460.76" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16.5" font-weight="600" fill="#2F6BA8">vault-sync</text><text x="394.92878048780494" y="459.63" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Sincroniza con el Vault. Jamás </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.8" fill="#13171E">--force</tspan><tspan>.</tspan></text><line x1="156" y1="479.76" x2="1009.3170731707318" y2="479.76" stroke="#D2D7DF" stroke-width="1"/></g><g id="note"><rect x="156" y="501.76" width="853.3170731707318" height="79.3" fill="#F3E8D2" rx="2"/><rect x="156" y="501.76" width="3" height="79.3" fill="#A8761C" rx="0"/><text x="178" y="530.02" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Sin comando, </tspan><tspan font-weight="650" fill="#13171E">se autodetecta</tspan><tspan>: hay lockfile → </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">upgrade</tspan><tspan> · hay estructura previa → </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">adopt</tspan><tspan> · repo</tspan></text><text x="178" y="554.67" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>limpio → </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">init</tspan><tspan>.</tspan></text></g><g id="terminal"><rect x="1039.3170731707319" y="178" width="812.6829268292684" height="273.28000000000003" fill="#14181F" stroke="#2B323D" stroke-width="1" rx="3"/><text x="1061.3170731707319" y="210.8" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#79838F" xml:space="preserve"># ver el plan sin escribir un solo byte</text><text x="1061.3170731707319" y="236.72000000000003" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#D9A441" xml:space="preserve">$ </text><text x="1080.5490731707318" y="236.72000000000003" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#DCE2EA" xml:space="preserve">npx …souclaude-harness#v3 --dry-run</text><text x="1061.3170731707319" y="262.64" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#DCE2EA" xml:space="preserve"></text><text x="1061.3170731707319" y="288.56" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#3EA372" xml:space="preserve">create</text><text x="1119.0130731707318" y="288.56" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#DCE2EA" xml:space="preserve">   CLAUDE.md</text><text x="1061.3170731707319" y="314.48" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#3EA372" xml:space="preserve">create</text><text x="1119.0130731707318" y="314.48" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#DCE2EA" xml:space="preserve">   .claude/skills/soutec-github/</text><text x="1061.3170731707319" y="340.40000000000003" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#3EA372" xml:space="preserve">create</text><text x="1119.0130731707318" y="340.40000000000003" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#DCE2EA" xml:space="preserve">   progress/README.md</text><text x="1061.3170731707319" y="366.32000000000005" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#79838F" xml:space="preserve">noop</text><text x="1099.7810731707318" y="366.32000000000005" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#79838F" xml:space="preserve">     .gitignore (bloque ya presente)</text><text x="1061.3170731707319" y="392.24" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#DCE2EA" xml:space="preserve"></text><text x="1061.3170731707319" y="418.16" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#79838F" xml:space="preserve">→ 0 bytes escritos</text></g><g id="bullets"><circle cx="1044.3170731707319" cy="482.28000000000003" r="3.5" fill="#A8761C"/><text x="1059.3170731707319" y="487.32000000000005" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-weight="650" fill="#13171E">--dry-run</tspan><tspan> imprime el plan y no escribe nada. El árbol queda byte-idéntico.</tspan></text><circle cx="1044.3170731707319" cy="517.84" r="3.5" fill="#A8761C"/><text x="1059.3170731707319" y="522.88" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-weight="650" fill="#13171E">--yes</tspan><tspan> acepta los defaults; </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16.2" fill="#13171E">--name --type --stack --lang</tspan><tspan> responden sin modo</tspan></text><text x="1059.3170731707319" y="548.4399999999999" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>interactivo.</tspan></text></g></g></svg>

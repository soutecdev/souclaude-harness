<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><radialGradient id="wash" cx="70%" cy="12%" r="80%"><stop offset="0%" stop-color="#F3E8D2" stop-opacity="1"/><stop offset="100%" stop-color="#F3E8D2" stop-opacity="0"/></radialGradient></defs><g id="slide-12"><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF" rx="0"/><rect x="0" y="0" width="88" height="1080" fill="#F2F4F8" rx="0"/><line x1="88" y1="0" x2="88" y2="1080" stroke="#D2D7DF" stroke-width="1"/><text transform="translate(50 92) rotate(90)" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.2" fill="#A8761C">VISIBILIDAD</text><line x1="44" y1="300" x2="44" y2="950" stroke="#BBC3CE" stroke-width="1"/><text transform="translate(49 970) rotate(90)" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#5C6573">VI</text><text x="156" y="76" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.1" fill="#A8761C" text-anchor="start">VISIBILIDAD</text><text x="1852" y="76" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#5C6573" text-anchor="end">12 / 13</text><line x1="156" y1="98" x2="1852" y2="98" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="144" font-family="Georgia, Constantia, Charter, serif" font-size="50" fill="#13171E">El equipo ve dónde se va el esfuerzo</text><g id="tiles"><rect x="156" y="178" width="412" height="128" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><text x="176" y="208" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5" fill="#5C6573" text-anchor="start">VENTANA 5H</text><text x="176" y="262" font-family="Georgia, Constantia, Charter, serif" font-size="46" fill="#13171E">38<tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="19" fill="#5C6573">%</tspan></text><text x="176" y="286" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#5C6573">del límite de la cuenta</text><rect x="584" y="178" width="412" height="128" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><text x="604" y="208" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5" fill="#5C6573" text-anchor="start">VENTANA 7D</text><text x="604" y="262" font-family="Georgia, Constantia, Charter, serif" font-size="46" fill="#13171E">61<tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="19" fill="#5C6573">%</tspan></text><text x="604" y="286" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#5C6573">consumo propio del período</text><rect x="1012" y="178" width="412" height="128" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><text x="1032" y="208" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5" fill="#5C6573" text-anchor="start">SESIONES</text><text x="1032" y="262" font-family="Georgia, Constantia, Charter, serif" font-size="46" fill="#13171E">3</text><text x="1032" y="286" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#5C6573">activas ahora en el equipo</text><rect x="1440" y="178" width="412" height="128" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><text x="1460" y="208" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5" fill="#5C6573" text-anchor="start">PROYECTOS</text><text x="1460" y="262" font-family="Georgia, Constantia, Charter, serif" font-size="46" fill="#13171E">4</text><text x="1460" y="286" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#5C6573">publicando en el Vault</text></g><g id="bullets"><circle cx="161" cy="375" r="3.5" fill="#A8761C"/><text x="176" y="380.04" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16.2" fill="#13171E">npx souclaude monitor</tspan><tspan> abre el panel en vivo; </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16.2" fill="#13171E">--usage</tspan><tspan> da el informe completo con filtros por proyecto, contribuyente y cuenta.</tspan></text><circle cx="161" cy="410.56" r="3.5" fill="#A8761C"/><text x="176" y="415.6" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Con el panel abierto, *</tspan><tspan font-weight="650" fill="#13171E">cada sesión publica sola su línea</tspan><tspan>* en </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16.2" fill="#13171E">sessions.md</tspan><tspan> y la actualiza mientras sigue viv</tspan></text><circle cx="161" cy="446.12" r="3.5" fill="#A8761C"/><text x="176" y="451.16" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Una línea que editaste a mano </tspan><tspan font-weight="650" fill="#13171E">nunca se pisa</tspan><tspan>: el monitor solo actualiza la que escribió él, byte a byte.</tspan></text></g><line x1="156" y1="988.8" x2="1852" y2="988.8" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="1013.28" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C6573" text-anchor="start" xml:space="preserve"><tspan>Las cifras de arriba son de ejemplo, para mostrar la forma del panel. Los datos reales salen del registro del Vault.</tspan></text></g></svg>

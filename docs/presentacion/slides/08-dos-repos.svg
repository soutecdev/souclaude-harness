vetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Todo cambio se revisa</tspan></text><text x="1173.6" y="301.31" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>El tablero refleja el ahora</tspan></text><line x1="156" y1="317.88" x2="1852" y2="317.88" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="336.75" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>[object Object]</tspan></text><text x="495.20000000000005" y="336.75" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.8" fill="#13171E">tipo/&lt;ID&gt;-&lt;slug&gt;</tspan><tspan> desde </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.8" fill="#13171E">dev</tspan></text><text x="1173.6" y="336.75" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>No hay: se escribe en </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.8" fill="#13171E">main</tspan></text><line x1="156" y1="353.32" x2="1852" y2="353.32" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="372.19" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>[object Object]</tspan></text><text x="495.20000000000005" y="372.19" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.8" fill="#13171E">dev</tspan><tspan> → </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.8" fill="#13171E">main</tspan><tspan> por PR, y recién ahí los tags</tspan></text><text x="1173.6" y="372.19" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>No aplica</tspan></text><line x1="156" y1="388.76" x2="1852" y2="388.76" stroke="#D2D7DF" stroke-width="1"/></g><g id="note"><rect x="156" y="446.76" width="1696" height="54.65" fill="#F3E8D2" rx="2"/><rect x="156" y="446.76" width="3" height="54.65" fill="#A8761C" rx="0"/><text x="178" y="475.02" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Nunca se cruzan: código, diffs y tests jamás van al Vault; los artefactos del Vault jamás se commitean en el proyecto. Y en ninguno de los dos: </tspan><tspan font-weight="650" fill="#13171E">nunca `git push --force</tspan></text></g></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><radialGradient id="wash" cx="70%" cy="12%" r="80%"><stop offset="0%" stop-color="#F3E8D2" stop-opacity="1"/><stop offset="100%" stop-color="#F3E8D2" stop-opacity="0"/></radialGradient></defs><g id="slide-11"><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF" rx="0"/><rect x="0" y="0" width="88" height="1080" fill="#F2F4F8" rx="0"/><line x1="88" y1="0" x2="88" y2="1080" stroke="#D2D7DF" stroke-width="1"/><text transform="translate(50 92) rotate(90)" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.2" fill="#A8761C">VISIBILIDAD</text><line x1="44" y1="300" x2="44" y2="950" stroke="#BBC3CE" stroke-width="1"/><text transform="translate(49 970) rotate(90)" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#5C6573">VI</text><text x="156" y="76" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.1" fill="#A8761C" text-anchor="start">VISIBILIDAD</text><text x="1852" y="76" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#5C6573" text-anchor="end">11 / 13</text><line x1="156" y1="98" x2="1852" y2="98" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="144" font-family="Georgia, Constantia, Charter, serif" font-size="50" fill="#13171E">El tablero, espejado en Jira</text><g id="chain"><rect x="156" y="178" width="404.5" height="92" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><rect x="156" y="178" width="404.5" height="2" fill="#A8761C" rx="0"/><text x="172" y="204" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#5C6573" text-anchor="start">MUEVES</text><text x="172" y="228" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="600" fill="#13171E">la tarjeta</text><text x="573.5" y="232" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#A8761C" text-anchor="middle">→</text><rect x="586.5" y="178" width="404.5" height="92" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><rect x="586.5" y="178" width="404.5" height="2" fill="#A8761C" rx="0"/><text x="602.5" y="204" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#5C6573" text-anchor="start">COMMIT</text><text x="602.5" y="228" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="600" fill="#13171E">al Vault</text><text x="1004" y="232" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#A8761C" text-anchor="middle">→</text><rect x="1017" y="178" width="404.5" height="92" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><rect x="1017" y="178" width="404.5" height="2" fill="#A8761C" rx="0"/><text x="1033" y="204" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#5C6573" text-anchor="start">PUSH</text><text x="1033" y="228" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="600" fill="#13171E">a main</text><text x="1434.5" y="232" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#A8761C" text-anchor="middle">→</text><rect x="1447.5" y="178" width="404.5" height="92" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><rect x="1447.5" y="178" width="404.5" height="2" fill="#A8761C" rx="0"/><text x="1463.5" y="204" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#5C6573" text-anchor="start">Y RECIÉN</text><text x="1463.5" y="228" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="600" fill="#13171E">Jira</text></g><g id="kv"><text x="156" y="342.8" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15" font-weight="600" fill="#A8761C">Milestone</text><text x="306" y="342.48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Una *</tspan><tspan font-weight="650" fill="#13171E">épica</tspan><tspan>*, con su descripción y la etiqueta </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.4" fill="#13171E">&lt;PREFIJO&gt;-M&lt;n</tspan></text><line x1="156" y1="358.4" x2="989" y2="358.4" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="379.2" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15" font-weight="600" fill="#A8761C">Tarea</text><text x="306" y="378.88" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Un *</tspan><tspan font-weight="650" fill="#13171E">issue hijo</tspan><tspan>* de esa épica. El ID en el summary es la clave de idempotencia: nun</tspan></text><text x="306" y="401.28" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>ca se dupli</tspan></text><line x1="156" y1="417.2" x2="989" y2="417.2" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="438" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15" font-weight="600" fill="#A8761C">Columna</text><text x="306" y="437.68" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Backlog → To Do · En curso → In Progress · En review → In Review · Hecho → Done.</tspan></text><line x1="156" y1="453.59999999999997" x2="989" y2="453.59999999999997" stroke="#D2D7DF" stroke-width="1"/></g><g id="bullets"><circle cx="1024" cy="338.25" r="3.5" fill="#A8761C"/><text x="1039" y="342.87" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Se sincroniza *</tspan><tspan font-weight="650" fill="#13171E">en el momento</tspan><tspan>* en que mueves la tarjeta, no al final del dí</tspan></text><circle cx="1024" cy="371.68" r="3.5" fill="#A8761C"/><text x="1039" y="376.3" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>*</tspan><tspan font-weight="650" fill="#13171E">Jira nunca es la fuente.</tspan><tspan>* Si alguien mueve un issue allá, se reporta la divergencia — no se to</tspan></text><text x="1039" y="399.73" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>ca el Vault para igual</tspan></text><circle cx="1024" cy="428.54" r="3.5" fill="#A8761C"/><text x="1039" y="433.16" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Sin conector autorizado: se avisa una vez y el trabajo local sigue.</tspan></text><circle cx="1024" cy="461.97" r="3.5" fill="#A8761C"/><text x="1039" y="466.59000000000003" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>No se borran issues: una tarea eliminada se comenta y se cierra.</tspan></text></g><line x1="156" y1="988.8" x2="1852" y2="988.8" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="1013.28" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C6573" text-anchor="start" xml:space="preserve"><tspan>Cada proyecto del Vault tiene su propio proyecto en Jira, y la clave es el mismo PREFIJO: </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.4" fill="#13171E">Project-SHS</tspan><tspan> → </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.4" fill="#13171E">SHS</tspan><tspan>.</tspan></text></g></svg>

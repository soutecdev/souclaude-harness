<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><radialGradient id="wash" cx="70%" cy="12%" r="80%"><stop offset="0%" stop-color="#F3E8D2" stop-opacity="1"/><stop offset="100%" stop-color="#F3E8D2" stop-opacity="0"/></radialGradient></defs><g id="slide-10"><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF" rx="0"/><rect x="0" y="0" width="88" height="1080" fill="#F2F4F8" rx="0"/><line x1="88" y1="0" x2="88" y2="1080" stroke="#D2D7DF" stroke-width="1"/><text transform="translate(50 92) rotate(90)" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.2" fill="#A8761C">TU CÓDIGO</text><line x1="44" y1="300" x2="44" y2="950" stroke="#BBC3CE" stroke-width="1"/><text transform="translate(49 970) rotate(90)" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#5C6573">V</text><text x="156" y="76" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.1" fill="#A8761C" text-anchor="start">TU CÓDIGO</text><text x="1852" y="76" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#5C6573" text-anchor="end">10 / 13</text><line x1="156" y1="98" x2="1852" y2="98" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="144" font-family="Georgia, Constantia, Charter, serif" font-size="50" fill="#13171E">Un archivo tuyo nunca se sobrescribe en silencio</text><g id="terminal"><rect x="156" y="178" width="824.7524752475248" height="210.1" fill="#14181F" stroke="#2B323D" stroke-width="1" rx="3"/><text x="178" y="210" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#D9A441" xml:space="preserve">$ </text><text x="196.03" y="210" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#DCE2EA" xml:space="preserve">npx …souclaude-harness#v3 upgrade</text><text x="178" y="234.3" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#DCE2EA" xml:space="preserve"></text><text x="178" y="258.6" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#3EA372" xml:space="preserve">update</text><text x="232.09" y="258.6" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#DCE2EA" xml:space="preserve">   .claude/settings.json</text><text x="178" y="282.9" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#79838F" xml:space="preserve">keep</text><text x="214.06" y="282.9" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#79838F" xml:space="preserve">     CLAUDE.md</text><text x="340.27" y="282.9" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#79838F" xml:space="preserve">  (lo editaste tú)</text><text x="178" y="307.2" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#D9A441" xml:space="preserve">new</text><text x="205.045" y="307.2" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#DCE2EA" xml:space="preserve">      CLAUDE.md.new</text><text x="178" y="331.5" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#DCE2EA" xml:space="preserve"></text><text x="178" y="355.8" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15" fill="#79838F" xml:space="preserve">→ tu version intacta</text></g><g id="bullets"><circle cx="161" cy="418.35" r="3.5" fill="#A8761C"/><text x="176" y="422.97" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Si tocaste un archivo gestionado, el harness *</tspan><tspan font-weight="650" fill="#13171E">no lo pisa</tspan><tspan>*: deja la versión nueva al lado co</tspan></text><text x="176" y="446.40000000000003" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>mo </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.8" fill="#13171E">.n</tspan></text><circle cx="161" cy="475.21000000000004" r="3.5" fill="#A8761C"/><text x="176" y="479.83000000000004" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Comparas, te quedas con lo que sirve y borras el </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.8" fill="#13171E">.new</tspan><tspan>. La decisión es tuya.</tspan></text><circle cx="161" cy="508.64000000000004" r="3.5" fill="#A8761C"/><text x="176" y="513.26" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Antes de sobrescribir cualquier cosa hay copia en </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.8" fill="#13171E">.claude/backup-&lt;ts&gt;/</tspan><tspan>.</tspan></text></g><g id="table"><text x="1010.7524752475248" y="190" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5" fill="#5C6573" text-anchor="start">SITUACIÓN</text><text x="1380.9013861386138" y="190" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5" fill="#5C6573" text-anchor="start">VEREDICTO</text><text x="1549.1508910891089" y="190" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5" fill="#5C6573" text-anchor="start">QUÉ PASA</text><line x1="1010.7524752475248" y1="202" x2="1852" y2="202" stroke="#BBC3CE" stroke-width="1"/><text x="1010.7524752475248" y="225.7" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>No está en disco</tspan></text><circle cx="1385.9013861386138" cy="222" r="4.5" fill="#0F7A4A"/><text x="1395.9013861386138" y="228" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15" font-weight="600" fill="#0F7A4A">create</text><text x="1549.1508910891089" y="225.7" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Se crea.</tspan></text><line x1="1010.7524752475248" y1="247" x2="1852" y2="247" stroke="#D2D7DF" stroke-width="1"/><text x="1010.7524752475248" y="264.7" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Está, intacto, cambió el template</tspan></text><circle cx="1385.9013861386138" cy="261" r="4.5" fill="#2F6BA8"/><text x="1395.9013861386138" y="267" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15" font-weight="600" fill="#2F6BA8">update</text><text x="1549.1508910891089" y="264.7" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Se actualiza.</tspan></text><line x1="1010.7524752475248" y1="286" x2="1852" y2="286" stroke="#D2D7DF" stroke-width="1"/><text x="1010.7524752475248" y="303.7" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Está, intacto, sin cambios</tspan></text><circle cx="1385.9013861386138" cy="300" r="4.5" fill="#5C6573"/><text x="1395.9013861386138" y="306" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15" font-weight="600" fill="#5C6573">noop</text><text x="1549.1508910891089" y="303.7" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Nada.</tspan></text><line x1="1010.7524752475248" y1="325" x2="1852" y2="325" stroke="#D2D7DF" stroke-width="1"/><text x="1010.7524752475248" y="342.7" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-weight="650" fill="#13171E">Lo editaste tú</tspan><tspan>, sin cambios</tspan></text><circle cx="1385.9013861386138" cy="339" r="4.5" fill="#5C6573"/><text x="1395.9013861386138" y="345" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15" font-weight="600" fill="#5C6573">local-edit</text><text x="1549.1508910891089" y="342.7" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Se respeta.</tspan></text><line x1="1010.7524752475248" y1="364" x2="1852" y2="364" stroke="#D2D7DF" stroke-width="1"/><text x="1010.7524752475248" y="381.7" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-weight="650" fill="#13171E">Lo editaste tú</tspan><tspan>, cambió</tspan></text><circle cx="1385.9013861386138" cy="378" r="4.5" fill="#B23A26"/><text x="1395.9013861386138" y="384" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15" font-weight="600" fill="#B23A26">conflict</text><text x="1549.1508910891089" y="381.7" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-weight="650" fill="#13171E">Nunca se pisa</tspan><tspan> → </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13.5" fill="#13171E">.new</tspan><tspan>.</tspan></text><line x1="1010.7524752475248" y1="403" x2="1852" y2="403" stroke="#D2D7DF" stroke-width="1"/><text x="1010.7524752475248" y="420.7" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Existía y lo borraste</tspan></text><circle cx="1385.9013861386138" cy="417" r="4.5" fill="#0F7A4A"/><text x="1395.9013861386138" y="423" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15" font-weight="600" fill="#0F7A4A">restore</text><text x="1549.1508910891089" y="420.7" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Se reescribe.</tspan></text><line x1="1010.7524752475248" y1="442" x2="1852" y2="442" stroke="#D2D7DF" stroke-width="1"/><text x="1010.7524752475248" y="459.7" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Ya no está en el manifest</tspan></text><circle cx="1385.9013861386138" cy="456" r="4.5" fill="#B23A26"/><text x="1395.9013861386138" y="462" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15" font-weight="600" fill="#B23A26">obsolete</text><text x="1549.1508910891089" y="459.7" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Solo con </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13.5" fill="#13171E">--prune</tspan><tspan>.</tspan></text><line x1="1010.7524752475248" y1="481" x2="1852" y2="481" stroke="#D2D7DF" stroke-width="1"/></g><line x1="156" y1="988.8" x2="1852" y2="988.8" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="1013.28" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C6573" text-anchor="start" xml:space="preserve"><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.4" fill="#13171E">--prune</tspan><tspan> exige tipear BORRAR y </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.4" fill="#13171E">--force</tspan><tspan> exige tipear FORCE. La herramienta obedece las mismas reglas que instala.</tspan></text></g></svg>

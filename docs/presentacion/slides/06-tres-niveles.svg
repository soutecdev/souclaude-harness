xt></g><g id="kv"><text x="156" y="345.2" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.5" font-weight="600" fill="#A8761C">milestones.md</text><text x="306" y="344.87" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>El tablero de milestones: qué se persigue. La tarjeta lleva dueño, máquina y el plan activo.</tspan></text><line x1="156" y1="361.1" x2="1852" y2="361.1" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="382.3" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.5" font-weight="600" fill="#A8761C">plans/</text><text x="306" y="381.97" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Un archivo por plan: qué se va a hacer, en qué orden y con qué criterio de éxito. Un milestone puede cambiar de plan — el viejo </tspan><tspan font-weight="650" fill="#13171E">no se borra</tspan><tspan>.</tspan></text><line x1="156" y1="398.20000000000005" x2="1852" y2="398.20000000000005" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="419.40000000000003" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.5" font-weight="600" fill="#A8761C">kanban.md</text><text x="306" y="419.07000000000005" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Las tareas del milestone en curso, en cuatro columnas: Backlog, En curso, En review, Hecho.</tspan></text><line x1="156" y1="435.30000000000007" x2="1852" y2="435.30000000000007" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="456.50000000000006" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.5" font-weight="600" fill="#A8761C">sessions.md</text><text x="306" y="456.1700000000001" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Append-only: una línea por sesión con quién, qué tocó y cuántos tokens costó.</tspan></text><line x1="156" y1="472.4000000000001" x2="1852" y2="472.4000000000001" stroke="#D2D7DF" stroke-width="1"/></g><line x1="156" y1="988.8" x2="1852" y2="988.8" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="1013.28" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C6573" text-anchor="start" xml:space="preserve"><tspan>El milestone es la unidad de anti-solapamiento entre máquinas; la tarea es la unidad de trabajo del día.</tspan></text></g></svg>

name: Reglas PR

# Reglas deterministas de la skill soutec-github (rama, commits, secretos,
# base=dev, mergeable, version, secciones de la plantilla). Solo corre en PR:
# el script necesita gh pr view para leer el cuerpo del PR. Este workflow y
# scripts/check-pr-rules.mjs los distribuye y actualiza el harness (npx
# souclaude upgrade); no los edites a mano en el repo consumidor.

on:
  pull_request:

jobs:
  reglas-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: verifica reglas de PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/check-pr-rules.mjs --pr ${{ github.event.pull_request.number }}

name: Reglas PR - rama y commits

# Grupo "rama-commits" (SHS-M33) de check-pr-rules.mjs: formato de rama y de
# commits. CI opcional a proposito -- un nombre de rama o un commit con una
# letra distinta no debe trabar un merge, solo avisar. github-protect.js NO
# suma este check a required_status_checks. Este workflow y
# scripts/check-pr-rules.mjs los distribuye y actualiza el harness (npx
# souclaude upgrade); no los edites a mano en el repo consumidor.

on:
  pull_request:

jobs:
  reglas-rama-commits:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: verifica formato de rama y commits
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/check-pr-rules.mjs --grupo rama-commits

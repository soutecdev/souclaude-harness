name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    # Windows es el entorno real de los devs de SOUTEC (OneDrive, CRLF, rutas con
    # espacios). Ubuntu esta para que el lockfile escrito en Windows se pueda leer
    # desde CI: por eso el hash se normaliza a LF y las rutas van en POSIX.
    # Node 22 custodia el piso de engines (>=22.4, por allowNegative en parseArgs);
    # 24 es la version de trabajo del equipo.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22, 24]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci

      # SHS-M14: node --test corre archivos en paralelo por defecto (concurrencia
      # = CPUs). En ubuntu + Node 22 eso deja una ventana de carrera real en el
      # pipe IPC que el test runner usa para reportar resultados estructurados al
      # proceso padre -- no es un bug del codigo de los tests, es el runner
      # corrompiendo su propio canal bajo solapamiento de procesos hijos.
      # --test-concurrency=1 en CI elimina la carrera; en local (npm test) la
      # suite sigue en paralelo, que es rapido y no reproduce el problema.
      - run: npm run test:ci

      - name: verifica integridad del manifest (huerfanos, rutas rotas, duplicados, criticos)
        run: node bin/cli.mjs verify --strict

      # El CLI tiene que poder instalarse sobre un repo real sin escribir nada.
      - name: dry-run sobre el propio repo
        run: node bin/cli.mjs upgrade --dry-run --yes

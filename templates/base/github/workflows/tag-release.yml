name: Tag de release

# Automatiza lo que la skill soutec-github documenta como paso manual del
# agente: tras el merge de release dev -> main, crea el tag inmutable vX.Y.Z
# (leyendo package.json del commit de merge) y mueve el tag móvil vX. Luego crea
# (o actualiza) el GitHub Release con scripts/release-publicar.mjs, tomando el
# título y la descripción corta (menos de 30 palabras) de la sección
# "## Release en GitHub" del cuerpo del PR de release (SHS-M44). Este workflow y
# los scripts los distribuye y actualiza el harness (npx souclaude upgrade); no
# los edites a mano en el repo consumidor.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

jobs:
  tag-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: identidad git para el tag anotado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: crea/actualiza el tag de release
        run: node scripts/tag-release.mjs

      # No bloquea: si el PR no trae la sección "## Release en GitHub" (o el texto
      # no valida), el tag ya quedó creado y el release lo cierra el agente
      # (skill soutec-github, "Cierre del release").
      - name: crea/actualiza el GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-publicar.mjs --desde-pr ${{ github.event.pull_request.number }}

name: Reglas PR - secretos

# Grupo "secretos" (SHS-M33) de check-pr-rules.mjs: ningun .env/.pem/.key/.pfx/
# credentials.json/secrets.json agregado en el PR. CI required -- esto si
# protege al sistema, no bloquea por estilo. Este workflow y
# scripts/check-pr-rules.mjs los distribuye y actualiza el harness (npx
# souclaude upgrade); no los edites a mano en el repo consumidor.

on:
  pull_request:

jobs:
  reglas-secretos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: verifica que no se agregaron archivos de secretos
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/check-pr-rules.mjs --grupo secretos
